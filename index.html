<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Air Liquide Egypt | Security</title>

  <!-- إعدادات شاشة التثبيت للموبايل -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALE Security">
  <link rel="apple-touch-icon" href="app-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      /* صورة الخلفية bg مع معالجة التوافق */
      background-color: #0b192c;
      background-image: linear-gradient(rgba(10, 25, 47, 0.65), rgba(10, 25, 47, 0.75)), url('bg.png'), url('bg.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* شبكة الكروت الأربعة الكبيرة */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 18px 10px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .card:active {
      transform: scale(0.95);
      filter: brightness(0.92);
    }

    /* ضبط حجم الأيقونة والصورة لتملأ الكارت بشكل بارز */
    .card-img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 18px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
      text-align: center;
    }

    .card-sub {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-top: 3px;
      direction: ltr;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Air Liquide Egypt | Security</h1>
    </div>

    <div class="grid">
      <!-- 1. بلاتفورم الإدارة -->
      <a href="https://sites.google.com/airliquide.com/security" target="_blank" class="card">
        <img src="icon1.png" onerror="this.onerror=null; this.src='icon1.jpg';" alt="بلاتفورم الإدارة" class="card-img">
        <span class="card-title">بلاتفورم الإدارة</span>
        <span class="card-sub">Management Platform</span>
      </a>

      <!-- 2. حضور وانصراف الموظفين -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbwD63oCu4ke-dwRHn0-jIb5XXQcaKeabZAAdf40IAgYToPk8cFf7g-lnxayAbzMbY-OhQ/exec" target="_blank" class="card">
        <img src="icon2.png" onerror="this.onerror=null; this.src='icon2.jpg';" alt="حضور وانصراف" class="card-img">
        <span class="card-title">حضور وانصراف</span>
        <span class="card-sub">Attendance Check</span>
      </a>

      <!-- 3. انداكشن أمن الزوار -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbxZrqMnVwWogl5eesV4TA4VuZqvG8SN71n5Emd275hBKsGFXL_iyZ8HgurFSx3Ob26jug/exec" target="_blank" class="card">
        <img src="icon3.png" onerror="this.onerror=null; this.src='icon3.jpg';" alt="أمن الزوار" class="card-img">
        <span class="card-title">أمن الزوار</span>
        <span class="card-sub">Visitor Induction</span>
      </a>

      <!-- 4. فحص طفايات الحريق -->
      <a href="https://script.google.com/macros/s/AKfycbyHHzt3TCAWmQUINb4glC1wFOOno8nrvRcxoXLVZ4p5RXOFdKXRuNmPY2t636P08cU-sw/exec" target="_blank" class="card">
        <img src="icon4.png" onerror="this.onerror=null; this.src='icon4.jpg';" alt="طفايات الحريق" class="card-img">
        <span class="card-title">طفايات الحريق</span>
        <span class="card-sub">Fire Inspection</span>
      </a>
    </div>
  </div>

</body>
</html>
