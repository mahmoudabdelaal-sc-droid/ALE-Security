<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Air Liquide Egypt | Security</title>

  <!-- إعدادات شاشة التثبيت للهاتف (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALE Security">
  <link rel="apple-touch-icon" href="app-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      background-color: #0b192c;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    /* طبقة الخلفية المتحركة (Cinematic Ken Burns Zoom) */
    .bg-animated {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: linear-gradient(rgba(10, 25, 47, 0.38), rgba(10, 25, 47, 0.65)), url('bg.png'), url('bg.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      animation: kenBurnsZoom 18s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes kenBurnsZoom {
      0% {
        transform: scale(1) translateY(0px);
      }
      100% {
        transform: scale(1.12) translateY(-10px);
      }
    }

    /* طبقة الجزيئات النيون العائمة في الخلفية */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particles span {
      position: absolute;
      bottom: -20px;
      width: 4px;
      height: 4px;
      background: rgba(56, 189, 248, 0.7);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9), 0 0 20px rgba(2, 132, 199, 0.6);
      animation: floatUp linear infinite;
    }

    .particles span:nth-child(1) { left: 12%; animation-duration: 9s; animation-delay: 0s; width: 3px; height: 3px; }
    .particles span:nth-child(2) { left: 28%; animation-duration: 13s; animation-delay: 2s; width: 5px; height: 5px; }
    .particles span:nth-child(3) { left: 45%; animation-duration: 10s; animation-delay: 4s; width: 3px; height: 3px; }
    .particles span:nth-child(4) { left: 63%; animation-duration: 14s; animation-delay: 1s; width: 4px; height: 4px; }
    .particles span:nth-child(5) { left: 78%; animation-duration: 11s; animation-delay: 3s; width: 5px; height: 5px; }
    .particles span:nth-child(6) { left: 90%; animation-duration: 12s; animation-delay: 5s; width: 3px; height: 3px; }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-105vh) scale(1.2);
        opacity: 0;
      }
    }

    /* الحاوية الرئيسية */
    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 50px;
    }

    /* العنوان بنمط نيون متوهج */
    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .header .main-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5), 0 2px 6px rgba(0, 0, 0, 0.85);
    }

    .header .sub-title {
      display: block;
      color: #38bdf8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 5px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.85);
      animation: pulseGlow 3.5s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
      100% { text-shadow: 0 0 18px rgba(56, 189, 248, 1), 0 0 28px rgba(2, 132, 199, 0.7); }
    }

    /* شبكة الأيقونات */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      width: 100%;
      justify-items: center;
    }

    /* الإطار الخارجي بإضاءة نيون وحواف مطابقة للأيقونة */
    .icon-btn {
      width: 100%;
      max-width: 155px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 26px;
      overflow: hidden;
      background: transparent;
      padding: 0;
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35),
                  0 8px 24px rgba(0, 0, 0, 0.6);
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* تكبير الصورة لتملأ كامل مساحة الإطار */
    .icon-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.36);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    /* تأثير اللمس */
    .icon-btn:active {
      transform: scale(0.93);
      border-color: rgba(56, 189, 248, 0.95);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
    }

    .icon-btn:active img {
      transform: scale(1.42);
      filter: brightness(1.15);
    }
  </style>
</head>
<body>

  <!-- الخلفية السينمائية المتحركة -->
  <div class="bg-animated"></div>

  <!-- جزيئات الإضاءة العائمة -->
  <div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- المحتوى والأيقونات -->
  <div class="container">
    <div class="header">
      <div class="main-title">Air Liquide Egypt</div>
      <span class="sub-title">SECURITY</span>
    </div>

    <div class="grid">
      <!-- 1. بلاتفورم الإدارة -->
      <a href="https://sites.google.com/airliquide.com/security" target="_blank" class="icon-btn">
        <img src="icon1.png" onerror="this.onerror=null; this.src='icon1.jpg';" alt="Platform">
      </a>

      <!-- 2. حضور وانصراف الموظفين -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbwD63oCu4ke-dwRHn0-jIb5XXQcaKeabZAAdf40IAgYToPk8cFf7g-lnxayAbzMbY-OhQ/exec" target="_blank" class="icon-btn">
        <img src="icon2.png" onerror="this.onerror=null; this.src='icon2.jpg';" alt="Attendance">
      </a>

      <!-- 3. انداكشن أمن الزوار -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbxZrqMnVwWogl5eesV4TA4VuZqvG8SN71n5Emd275hBKsGFXL_iyZ8HgurFSx3Ob26jug/exec" target="_blank" class="icon-btn">
        <img src="icon3.png" onerror="this.onerror=null; this.src='icon3.jpg';" alt="Visitor Induction">
      </a>

      <!-- 4. فحص طفايات الحريق -->
      <a href="https://script.google.com/macros/s/AKfycbyHHzt3TCAWmQUINb4glC1wFOOno8nrvRcxoXLVZ4p5RXOFdKXRuNmPY2t636P08cU-sw/exec" target="_blank" class="icon-btn">
        <img src="icon4.png" onerror="this.onerror=null; this.src='icon4.jpg';" alt="Fire Inspection">
      </a>
    </div>
  </div>

</body>
</html>
