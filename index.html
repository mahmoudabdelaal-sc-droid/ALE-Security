<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Air Liquide Egypt | Security</title>

  <!-- إعدادات شاشة التثبيت للهاتف (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALE Security">
  <link rel="apple-touch-icon" href="app-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* تثبيت الصفحة ومنع التمرير نهائياً */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #0b192c;
      /* دمج الخلفية بلون داكن يظهر فوراً لتفادي بطء التحميل */
      background-image: linear-gradient(rgba(10, 25, 47, 0.4), rgba(10, 25, 47, 0.65)), url('bg.png'), url('bg.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* الحاوية مع الإزاحة للأسفل بمسافة مناسبة */
    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 55px; /* إزاحة العنوان والكروت للأسفل */
    }

    /* العنوان بنمط نيون جذاب */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .main-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5), 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .header .sub-title {
      display: block;
      color: #38bdf8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 5px;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }

    /* شبكة الأيقونات */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      justify-items: center;
    }

    /* زر شفاف بالكامل بدون خلفية داكنة مع توهج نيون محيطي */
    .icon-btn {
      width: 100%;
      max-width: 160px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: transparent;
      border: none;
      padding: 0;
      border-radius: 26px;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      /* توهج نيون خافت وناعم خلف حواف الصورة */
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.35),
                  0 0 35px rgba(2, 132, 199, 0.2);
    }

    /* تمدد الصورة لتملأ الحجم بالكامل */
    .icon-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 26px;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.45));
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    /* تفاعل اللمس بزيادة توهج النيون والسطوع */
    .icon-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.75),
                  0 0 45px rgba(2, 132, 199, 0.4);
    }

    .icon-btn:active img {
      filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.9)) brightness(1.12);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="main-title">Air Liquide Egypt</div>
      <span class="sub-title">SECURITY</span>
    </div>

    <div class="grid">
      <!-- 1. بلاتفورم الإدارة -->
      <a href="https://sites.google.com/airliquide.com/security" target="_blank" class="icon-btn">
        <img src="icon1.png" onerror="this.onerror=null; this.src='icon1.jpg';" alt="Platform">
      </a>

      <!-- 2. حضور وانصراف الموظفين -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbwD63oCu4ke-dwRHn0-jIb5XXQcaKeabZAAdf40IAgYToPk8cFf7g-lnxayAbzMbY-OhQ/exec" target="_blank" class="icon-btn">
        <img src="icon2.png" onerror="this.onerror=null; this.src='icon2.jpg';" alt="Attendance">
      </a>

      <!-- 3. انداكشن أمن الزوار -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbxZrqMnVwWogl5eesV4TA4VuZqvG8SN71n5Emd275hBKsGFXL_iyZ8HgurFSx3Ob26jug/exec" target="_blank" class="icon-btn">
        <img src="icon3.png" onerror="this.onerror=null; this.src='icon3.jpg';" alt="Visitor Induction">
      </a>

      <!-- 4. فحص طفايات الحريق -->
      <a href="https://script.google.com/macros/s/AKfycbyHHzt3TCAWmQUINb4glC1wFOOno8nrvRcxoXLVZ4p5RXOFdKXRuNmPY2t636P08cU-sw/exec" target="_blank" class="icon-btn">
        <img src="icon4.png" onerror="this.onerror=null; this.src='icon4.jpg';" alt="Fire Inspection">
      </a>
    </div>
  </div>

</body>
</html>
