<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Air Liquide Egypt | Security</title>

  <!-- إعدادات شاشة التثبيت للموبايل (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALE Security">
  <link rel="apple-touch-icon" href="app-icon.png">

  <style>
    :root {
      --primary: #004b87;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      /* استخدام صورة الخلفية التكنولوجية مع تدرج لوني لحفظ التباين */
      background: linear-gradient(rgba(10, 25, 47, 0.72), rgba(10, 25, 47, 0.82)), url('bg.jpg') no-repeat center center / cover;
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    /* شبكة الأيقونات الأربعة الكبيرة */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 24px 12px;
      min-height: 175px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .card:active {
      transform: scale(0.95);
      filter: brightness(0.94);
    }

    /* تكبير حجم الأيقونات */
    .icon-box {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .icon-box svg {
      width: 44px;
      height: 44px;
    }

    /* ألوان واضحة لكل قسم */
    .c-blue .icon-box { background: #e0f2fe; }
    .c-blue svg { fill: #0284c7; }

    .c-green .icon-box { background: #dcfce7; }
    .c-green svg { fill: #16a34a; }

    .c-amber .icon-box { background: #fef3c7; }
    .c-amber svg { fill: #d97706; }

    .c-red .icon-box { background: #fee2e2; }
    .c-red svg { fill: #dc2626; }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
      text-align: center;
    }

    .card-sub {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      margin-top: 4px;
      direction: ltr;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Air Liquide Egypt | Security</h1>
    </div>

    <div class="grid">
      <!-- 1. بلاتفورم الإدارة -->
      <a href="https://sites.google.com/airliquide.com/security" target="_blank" class="card c-blue">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
        </div>
        <span class="card-title">بلاتفورم الإدارة</span>
        <span class="card-sub">Management Platform</span>
      </a>

      <!-- 2. حضور وانصراف الموظفين -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbwD63oCu4ke-dwRHn0-jIb5XXQcaKeabZAAdf40IAgYToPk8cFf7g-lnxayAbzMbY-OhQ/exec" target="_blank" class="card c-green">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        </div>
        <span class="card-title">حضور وانصراف</span>
        <span class="card-sub">Attendance Check</span>
      </a>

      <!-- 3. انداكشن أمن الزوار -->
      <a href="https://script.google.com/a/macros/airliquide.com/s/AKfycbxZrqMnVwWogl5eesV4TA4VuZqvG8SN71n5Emd275hBKsGFXL_iyZ8HgurFSx3Ob26jug/exec" target="_blank" class="card c-amber">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span class="card-title">أمن الزوار</span>
        <span class="card-sub">Visitor Induction</span>
      </a>

      <!-- 4. فحص طفايات الحريق -->
      <a href="https://script.google.com/macros/s/AKfycbyHHzt3TCAWmQUINb4glC1wFOOno8nrvRcxoXLVZ4p5RXOFdKXRuNmPY2t636P08cU-sw/exec" target="_blank" class="card c-red">
        <div class="icon-box">
          <svg viewBox="0 0 24 24"><path d="M19.48 12.35c-1.57-.56-2.9-1.54-3.83-2.83-.81 1.6-2.18 2.87-3.87 3.59-.57.24-1.18.41-1.78.5V17h6v2h-6v3h-2v-3H4v-2h4v-3.41c-.6-.09-1.21-.26-1.78-.5-1.69-.72-3.06-1.99-3.87-3.59-.93 1.29-2.26 2.27-3.83 2.83L-3 10.46c2.4-.85 4.35-2.6 5.37-4.88C3.06 4.09 4.39 3.01 6 2.45V1h2v1.45c1.61.56 2.94 1.64 3.63 3.13 1.02 2.28 2.97 4.03 5.37 4.88l-1.52 1.89zM12 6a2 2 0 100-4 2 2 0 000 4z"/></svg>
        </div>
        <span class="card-title">طفايات الحريق</span>
        <span class="card-sub">Fire Inspection</span>
      </a>
    </div>
  </div>

</body>
</html>
